apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workshop-app.fullname" . }}
  labels:
    {{- include "workshop-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "workshop-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "workshop-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "workshop-app.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.configmap.enabled .Values.secret.enabled }}
          env:
            {{- if .Values.configmap.enabled }}
            - name: AUTH0_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ if .Values.configmap.useExisting }}{{ .Values.configmap.existingName }}{{ else }}{{ include "workshop-app.fullname" . }}{{ end }}
                  key: auth0Issuer
            - name: WORKSHOP_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ if .Values.configmap.useExisting }}{{ .Values.configmap.existingName }}{{ else }}{{ include "workshop-app.fullname" . }}{{ end }}
                  key: corsOrigins
            {{- end }}
            {{- if .Values.secret.enabled }}
            - name: DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secret.useExisting }}{{ .Values.secret.existingName }}{{ else }}{{ include "workshop-app.fullname" . }}{{ end }}
                  key: datasourceUrl
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secret.useExisting }}{{ .Values.secret.existingName }}{{ else }}{{ include "workshop-app.fullname" . }}{{ end }}
                  key: auth0ClientId
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secret.useExisting }}{{ .Values.secret.existingName }}{{ else }}{{ include "workshop-app.fullname" . }}{{ end }}
                  key: auth0ClientSecret
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
